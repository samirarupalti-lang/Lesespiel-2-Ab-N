const tasks=[["Melone", ["Melone", "Name", "Palme"]], ["Alo", ["Alo", "Ole", "Leo"]], ["Ampel", ["Ampel", "Palme", "Lama"]], ["Name", ["Name", "Mama", "Lama"]], ["Palme", ["Palme", "Ampel", "Melone"]], ["Mama", ["Mama", "Oma", "Papa"]], ["malen", ["malen", "Melone", "Mama"]], ["Ole", ["Ole", "Leo", "Alo"]], ["Leo", ["Leo", "Ole", "Lena"]], ["Lena", ["Lena", "Leo", "Ela"]], ["Oma", ["Oma", "Mama", "Papa"]], ["Emma", ["Emma", "Ela", "Oma"]], ["Ela", ["Ela", "Emma", "Lena"]], ["Papa", ["Papa", "Mama", "Oma"]], ["Lama", ["Lama", "Mama", "Palme"]], ["am", ["am", "Alo", "Ela"]]];
let order=[],i=0,score=0,locked=false,currentAudio=null;
function shuffle(a){const b=[...a];for(let j=b.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[b[j],b[k]]=[b[k],b[j]]}return b}
function playAudio(){
  const target=order[i][0];
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}
  currentAudio=new Audio(wordAudio[target]);
  currentAudio.play().catch(()=>{feedback.textContent='Tippe bitte noch einmal auf „Wort anhören“.'});
}
function render(){locked=false;feedback.textContent='';next.style.display='none';counter.textContent='Wort '+(i+1)+' von '+order.length;bar.style.width=(i/order.length*100)+'%';answers.innerHTML='';shuffle(order[i][1]).forEach(txt=>{const b=document.createElement('button');b.className='answer';b.setAttribute('aria-label',txt);b.textContent=txt;b.addEventListener('click',()=>choose(txt,b));answers.appendChild(b)});setTimeout(playAudio,550)}
function rewardCoin(){const scoreEl=document.getElementById('score');const scoreBox=scoreEl.parentElement;const target=scoreBox.getBoundingClientRect();const coin=document.createElement('div');coin.className='coin-fly';coin.textContent='🪙';coin.setAttribute('aria-hidden','true');coin.style.left=(window.innerWidth/2)+'px';coin.style.top=Math.min(window.innerHeight*.62,520)+'px';coin.style.setProperty('--coin-x',(target.left+target.width/2)+'px');coin.style.setProperty('--coin-y',(target.top+target.height/2)+'px');document.body.appendChild(coin);requestAnimationFrame(()=>coin.classList.add('go'));setTimeout(()=>{score++;scoreEl.textContent=score;coin.remove();nextTask()},1280)}
function choose(txt,b){if(locked)return;if(txt===order[i][0]){locked=true;feedback.textContent='✓ Richtig!';document.querySelectorAll('.answer').forEach(x=>x.disabled=true);rewardCoin()}else{score=Math.max(0,score-1);document.getElementById('score').textContent=score;b.disabled=true;feedback.textContent='↻ Noch nicht. Eine Münze geht weg. Hör noch einmal genau hin.';setTimeout(playAudio,650)}}
function nextTask(){i++;if(i>=order.length){game.classList.add('hidden');finish.classList.remove('hidden');bar.style.width='100%';final.textContent=score+' Münzen'}else render()}
function restart(){if(currentAudio){currentAudio.pause();currentAudio=null};i=0;score=0;order=shuffle(tasks);document.getElementById('score').textContent='0';finish.classList.add('hidden');game.classList.remove('hidden');render()}
document.getElementById('audio').addEventListener('click',playAudio);document.getElementById('restart').addEventListener('click',restart);restart();
</script></body></html>
